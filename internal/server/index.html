<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>video-amplifier | Camera Snapshots</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121826;
      --card-border: #1f293d;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --badge-green: #10b981;
      --badge-yellow: #f59e0b;
      --badge-red: #ef4444;
      --badge-blue: #6366f1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand svg {
      width: 28px;
      height: 28px;
      fill: var(--accent);
    }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .header-links {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .header-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
    }
    .header-btn:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }
    main {
      flex: 1;
      padding: 1.5rem;
      max-width: 1800px;
      margin: 0 auto;
      width: 100%;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .stats-summary {
      font-size: 0.875rem;
      color: var(--text-muted);
      display: flex;
      gap: 1.25rem;
    }
    .stats-summary span strong {
      color: var(--text-main);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr));
      gap: 1.5rem;
    }
    .camera-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .camera-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
    }
    .card-header {
      padding: 0.875rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--card-border);
    }
    .cam-info h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.15rem;
    }
    .cam-id {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
    }
    .badges {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }
    .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-streaming, .badge-online {
      background: rgba(16, 185, 129, 0.15);
      color: var(--badge-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-idle, .badge-connecting {
      background: rgba(245, 158, 11, 0.15);
      color: var(--badge-yellow);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .badge-backoff, .badge-error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--badge-red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .badge-mode {
      background: rgba(99, 102, 241, 0.15);
      color: var(--badge-blue);
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .badge-auth {
      background: rgba(148, 163, 184, 0.12);
      color: var(--text-muted);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }
    .badge-auth-locked {
      background: rgba(245, 158, 11, 0.15);
      color: var(--badge-yellow);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.4);
      margin-left: 0.25rem;
    }
    .view-toggle button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.18rem 0.5rem;
      font-size: 0.6875rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      transition: all 0.15s ease;
    }
    .view-toggle button.active {
      background: var(--accent);
      color: #090d16;
    }
    .view-toggle button:hover:not(.active) {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }
    .video-viewport {
      position: relative;
      background: #000;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .video-viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .video-overlay {
      position: absolute;
      bottom: 0.5rem;
      right: 0.5rem;
      background: rgba(0, 0, 0, 0.7);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      backdrop-filter: blur(4px);
    }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--badge-green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .card-footer {
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.01);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.8125rem;
    }
    .metrics-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
    }
    .stream-urls {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }
    .url-chip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      font-family: monospace;
      font-size: 0.75rem;
      color: #93c5fd;
    }
    .url-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 0.5rem;
    }
    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0.1rem 0.3rem;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .copy-btn:hover {
      color: var(--accent);
    }
    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    footer {
      border-top: 1px solid var(--card-border);
      padding: 1rem;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24">
        <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"/>
      </svg>
      <h1>video-amplifier</h1>
    </div>
    <div class="header-links">
      <a href="/cameras" class="header-btn" target="_blank">JSON API</a>
      <a href="http://" id="metrics-link" class="header-btn" target="_blank">Metrics</a>
      <a href="/healthz" class="header-btn" target="_blank">Healthz</a>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="stats-summary" id="stats-summary">
        <span>Total Feeds: <strong id="stat-total">0</strong></span>
        <span>Active Viewers: <strong id="stat-clients">0</strong></span>
        <span>Data Ingested: <strong id="stat-bytes">0 MB</strong></span>
      </div>
      <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
        <label for="refresh-interval" style="font-size:0.8125rem; color:var(--text-muted);">View Mode:</label>
        <select id="refresh-interval" class="header-btn" style="padding:0.25rem 0.5rem; font-size:0.8125rem; background:#121826; color:var(--text-main); cursor:pointer;" onchange="onIntervalChange(this.value)">
          <option value="5000" selected>Snapshots (Every 5s - Default)</option>
          <option value="10000">Snapshots (Every 10s)</option>
          <option value="30000">Snapshots (Every 30s)</option>
          <option value="60000">Snapshots (Every 60s)</option>
          <option value="live">Live Stream (Continuous All)</option>
          <option value="0">Manual Refresh only</option>
        </select>
        <button id="refresh-now-btn" class="header-btn" style="cursor:pointer;" onclick="manualRefresh()">Refresh Now</button>
      </div>
    </div>

    <div class="grid" id="cameras-grid">
      <div class="empty-state">Loading camera feeds...</div>
    </div>
  </main>

  <footer>
    video-amplifier &bull; Single-Tenant Upstream Streaming Proxy &bull; Zero Transcode
  </footer>

  <script>
    const hostname = window.location.hostname || 'localhost';
    const httpPort = window.location.port || '8080';
    const metricsLink = document.getElementById('metrics-link');
    metricsLink.href = 'http://' + hostname + ':9090/metrics';

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function getBadgeClass(state) {
      switch ((state || '').toLowerCase()) {
        case 'streaming': return 'badge-streaming';
        case 'idle':
        case 'connecting': return 'badge-idle';
        case 'backoff': return 'badge-backoff';
        default: return 'badge-idle';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.innerText;
        btn.innerText = 'Copied!';
        setTimeout(() => { btn.innerText = orig; }, 1500);
      });
    }

    let cachedCameras = [];
    let cameraModes = {}; // camId -> 'snap' | 'live'
    let refreshTimer = null;
    let refreshIntervalMs = 5000;

    function setCameraMode(camId, mode) {
      cameraModes[camId] = mode;
      const imgEl = document.getElementById(`img-${camId}`);
      const timeEl = document.getElementById(`overlay-time-${camId}`);
      const btnSnap = document.getElementById(`btn-snap-${camId}`);
      const btnLive = document.getElementById(`btn-live-${camId}`);

      if (mode === 'live') {
        if (btnSnap) btnSnap.classList.remove('active');
        if (btnLive) btnLive.classList.add('active');
        if (timeEl) timeEl.textContent = 'LIVE STREAM';
        if (imgEl) {
          imgEl.src = `/cameras/${camId}/mjpeg`;
        }
      } else {
        if (btnSnap) btnSnap.classList.add('active');
        if (btnLive) btnLive.classList.remove('active');
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        if (timeEl) timeEl.textContent = `Snapshot · ${timeStr}`;
        if (imgEl) {
          imgEl.src = `/cameras/${camId}/snapshot.jpg?t=${Date.now()}`;
        }
      }
    }

    function refreshSnapshots() {
      const now = Date.now();
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      cachedCameras.forEach(cam => {
        if (cameraModes[cam.id] === 'live') return;

        const imgEl = document.getElementById(`img-${cam.id}`);
        if (!imgEl) return;
        const newImg = new Image();
        newImg.onload = () => {
          if (cameraModes[cam.id] !== 'live') {
            imgEl.src = newImg.src;
            const timeEl = document.getElementById(`overlay-time-${cam.id}`);
            if (timeEl) timeEl.textContent = `Snapshot · ${timeStr}`;
          }
        };
        newImg.src = `/cameras/${cam.id}/snapshot.jpg?t=${now}`;
      });
    }

    function restartTimer() {
      if (refreshTimer) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
      if (refreshIntervalMs > 0) {
        refreshTimer = setInterval(() => {
          updateDashboard();
          refreshSnapshots();
        }, refreshIntervalMs);
      }
    }

    function onIntervalChange(val) {
      if (val === 'live') {
        refreshIntervalMs = 0;
        restartTimer();
        cachedCameras.forEach(cam => setCameraMode(cam.id, 'live'));
      } else {
        refreshIntervalMs = parseInt(val, 10);
        cachedCameras.forEach(cam => setCameraMode(cam.id, 'snap'));
        restartTimer();
        refreshSnapshots();
      }
    }

    function manualRefresh() {
      updateDashboard();
      refreshSnapshots();
    }

    async function updateDashboard() {
      try {
        const res = await fetch('/cameras');
        if (!res.ok) throw new Error('API request failed');
        const cameras = await res.json();
        cachedCameras = cameras || [];

        const grid = document.getElementById('cameras-grid');
        if (!cameras || cameras.length === 0) {
          grid.innerHTML = '<div class="empty-state">No cameras configured in server configuration.</div>';
          return;
        }

        let totalClients = 0;
        let totalBytes = 0;

        cameras.forEach(c => {
          totalClients += (c.active_clients || 0);
          totalBytes += (c.bytes_received || 0);
        });

        document.getElementById('stat-total').innerText = cameras.length;
        document.getElementById('stat-clients').innerText = totalClients;
        document.getElementById('stat-bytes').innerText = formatBytes(totalBytes);

        // Render or update cards in-place
        const now = Date.now();
        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        cameras.forEach(cam => {
          if (!cameraModes[cam.id]) {
            const selectEl = document.getElementById('refresh-interval');
            cameraModes[cam.id] = (selectEl && selectEl.value === 'live') ? 'live' : 'snap';
          }
          const mode = cameraModes[cam.id];
          let card = document.getElementById(`card-${cam.id}`);

          // Determine auth badge and display properties
          const authMode = cam.auth_mode || 'none';
          const authRequired = !!cam.auth_required;
          let authBadgeClass = 'badge-auth';
          let authBadgeLabel = 'Auth: None';
          if (authMode === 'custom') {
            authBadgeClass = 'badge-auth-locked';
            authBadgeLabel = 'Auth: Custom';
          } else if (authMode === 'passthrough') {
            authBadgeClass = 'badge-auth-locked';
            authBadgeLabel = 'Auth: Passthrough';
          }

          // Direct browser playback URLs (browser will prompt for credentials via HTTP basic auth if required)
          const mjpegURL = window.location.protocol + '//' + window.location.host + '/cameras/' + cam.id + '/mjpeg';
          const snapURL = window.location.protocol + '//' + window.location.host + '/cameras/' + cam.id + '/snapshot.jpg';
          const initialSrc = mode === 'live' ? mjpegURL : `${snapURL}?t=${now}`;
          const overlayText = mode === 'live' ? 'LIVE STREAM' : `Snapshot &bull; ${timeStr}`;

          // Link representations:
          // 1. Displayed in UI (masked for security): e.g. rtsp://***:***@host:8554/id
          // 2. Full URL for clipboard copy: includes actual downstream username/password when configured
          const hasCreds = authRequired && (cam.downstream_username || cam.downstream_password);
          let copyAuthPrefix = '';
          let displayAuthPrefix = '';
          if (authRequired) {
            displayAuthPrefix = '***:***@';
            if (hasCreds) {
              const u = encodeURIComponent(cam.downstream_username || '');
              const p = encodeURIComponent(cam.downstream_password || '');
              copyAuthPrefix = `${u}:${p}@`;
            } else {
              copyAuthPrefix = '<username>:<password>@';
            }
          }

          const displaySnapURL = window.location.protocol + '//' + displayAuthPrefix + window.location.host + '/cameras/' + cam.id + '/snapshot.jpg';
          const displayMjpegURL = window.location.protocol + '//' + displayAuthPrefix + window.location.host + '/cameras/' + cam.id + '/mjpeg';
          const displayRtspURL = 'rtsp://' + displayAuthPrefix + hostname + ':8554/' + cam.id;

          const copySnapURL = window.location.protocol + '//' + copyAuthPrefix + window.location.host + '/cameras/' + cam.id + '/snapshot.jpg';
          const copyMjpegURL = window.location.protocol + '//' + copyAuthPrefix + window.location.host + '/cameras/' + cam.id + '/mjpeg';
          const copyRtspURL = 'rtsp://' + copyAuthPrefix + hostname + ':8554/' + cam.id;

          if (!card) {
            const emptyState = grid.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const cardHtml = `
              <div class="camera-card" id="card-${cam.id}">
                <div class="card-header">
                  <div class="cam-info">
                    <h2>${escapeHtml(cam.name || cam.id)}</h2>
                    <div class="cam-id">${escapeHtml(cam.id)}</div>
                  </div>
                  <div class="badges">
                    <span class="badge ${authBadgeClass}" id="badge-auth-${cam.id}">${escapeHtml(authBadgeLabel)}</span>
                    <span class="badge badge-mode">${escapeHtml(cam.mode)}</span>
                    <span class="badge ${getBadgeClass(cam.state)}" id="badge-state-${cam.id}">${escapeHtml(cam.state)}</span>
                    <div class="view-toggle">
                      <button id="btn-snap-${cam.id}" class="${mode === 'snap' ? 'active' : ''}" onclick="setCameraMode('${cam.id}', 'snap')">Snap</button>
                      <button id="btn-live-${cam.id}" class="${mode === 'live' ? 'active' : ''}" onclick="setCameraMode('${cam.id}', 'live')">Live</button>
                    </div>
                  </div>
                </div>

                <div class="video-viewport">
                  <img id="img-${cam.id}" src="${initialSrc}" alt="${escapeHtml(cam.name)}" onerror="this.onerror=null; this.src='/cameras/${cam.id}/snapshot.jpg?t=' + Date.now();" />
                  <div class="video-overlay">
                    <div class="live-dot" id="dot-${cam.id}"></div>
                    <span id="overlay-time-${cam.id}">${overlayText}</span>
                  </div>
                </div>

                <div class="card-footer">
                  <div class="metrics-row">
                    <span>Downstream Viewers: <strong id="clients-${cam.id}">${cam.active_clients || 0}</strong></span>
                    <span>Received: <strong id="bytes-${cam.id}">${formatBytes(cam.bytes_received)}</strong></span>
                  </div>

                  <div class="stream-urls">
                    <div class="url-chip" id="chip-snap-${cam.id}" title="${escapeHtml(displaySnapURL)}">
                      <span id="url-snap-${cam.id}">${escapeHtml(displaySnapURL)}</span>
                      <button class="copy-btn" id="btn-copy-snap-${cam.id}" onclick="copyToClipboard('${escapeHtml(copySnapURL)}', this)">Copy Snapshot</button>
                    </div>
                    <div class="url-chip" id="chip-mjpeg-${cam.id}" title="${escapeHtml(displayMjpegURL)}">
                      <span id="url-mjpeg-${cam.id}">${escapeHtml(displayMjpegURL)}</span>
                      <button class="copy-btn" id="btn-copy-mjpeg-${cam.id}" onclick="copyToClipboard('${escapeHtml(copyMjpegURL)}', this)">Copy MJPEG</button>
                    </div>
                    <div class="url-chip" id="chip-rtsp-${cam.id}" title="${escapeHtml(displayRtspURL)}">
                      <span id="url-rtsp-${cam.id}">${escapeHtml(displayRtspURL)}</span>
                      <button class="copy-btn" id="btn-copy-rtsp-${cam.id}" onclick="copyToClipboard('${escapeHtml(copyRtspURL)}', this)">Copy RTSP</button>
                    </div>
                  </div>
                </div>
              </div>
            `;
            grid.insertAdjacentHTML('beforeend', cardHtml);
          } else {
            const badge = document.getElementById(`badge-state-${cam.id}`);
            if (badge) {
              badge.className = `badge ${getBadgeClass(cam.state)}`;
              badge.innerText = cam.state;
            }
            const authBadge = document.getElementById(`badge-auth-${cam.id}`);
            if (authBadge) {
              authBadge.className = `badge ${authBadgeClass}`;
              authBadge.innerText = authBadgeLabel;
            }
            const clients = document.getElementById(`clients-${cam.id}`);
            if (clients) clients.innerText = cam.active_clients || 0;
            const bytes = document.getElementById(`bytes-${cam.id}`);
            if (bytes) bytes.innerText = formatBytes(cam.bytes_received);

            // Update URL chips text, titles, and click handlers in case auth configuration changed
            const urlSnap = document.getElementById(`url-snap-${cam.id}`);
            if (urlSnap) urlSnap.textContent = displaySnapURL;
            const chipSnap = document.getElementById(`chip-snap-${cam.id}`);
            if (chipSnap) chipSnap.title = displaySnapURL;
            const btnCopySnap = document.getElementById(`btn-copy-snap-${cam.id}`);
            if (btnCopySnap) btnCopySnap.onclick = function() { copyToClipboard(copySnapURL, this); };

            const urlMjpeg = document.getElementById(`url-mjpeg-${cam.id}`);
            if (urlMjpeg) urlMjpeg.textContent = displayMjpegURL;
            const chipMjpeg = document.getElementById(`chip-mjpeg-${cam.id}`);
            if (chipMjpeg) chipMjpeg.title = displayMjpegURL;
            const btnCopyMjpeg = document.getElementById(`btn-copy-mjpeg-${cam.id}`);
            if (btnCopyMjpeg) btnCopyMjpeg.onclick = function() { copyToClipboard(copyMjpegURL, this); };

            const urlRtsp = document.getElementById(`url-rtsp-${cam.id}`);
            if (urlRtsp) urlRtsp.textContent = displayRtspURL;
            const chipRtsp = document.getElementById(`chip-rtsp-${cam.id}`);
            if (chipRtsp) chipRtsp.title = displayRtspURL;
            const btnCopyRtsp = document.getElementById(`btn-copy-rtsp-${cam.id}`);
            if (btnCopyRtsp) btnCopyRtsp.onclick = function() { copyToClipboard(copyRtspURL, this); };
          }
        });

      } catch (err) {
        console.error('Failed refreshing camera dashboard', err);
      }
    }

    // Initial fetch and start interval timer
    updateDashboard().then(() => {
      restartTimer();
    });
  </script>
</body>
</html>
