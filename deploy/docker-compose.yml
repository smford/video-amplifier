version: "3.8"

services:
  video-amplifier:
    image: video-amplifier:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-amplifier
    restart: unless-stopped
    ports:
      - "8080:8080" # Web UI, MJPEG, WHEP, fMP4
      - "8554:8554" # RTSP relay
      - "9090:9090" # Prometheus metrics & healthz
    volumes:
      - ./config.yaml:/app/config.yaml:ro

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: video-amplifier-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - video-amplifier

  grafana:
    image: grafana/grafana:10.4.0
    container_name: video-amplifier-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    depends_on:
      - prometheus
